<text x="1072" y="563" font-size="18" fill="#52657c" font-weight="400" text-anchor="start">Context memory + safe-point context selection</text>
<text x="1072" y="588" font-size="18" fill="#52657c" font-weight="400" text-anchor="start">Owned queues + lifecycle and identity checks</text>
<text x="1072" y="613" font-size="18" fill="#52657c" font-weight="400" text-anchor="start">Monitoring + power-control handshakes</text>
<text x="1072" y="638" font-size="18" fill="#52657c" font-weight="400" text-anchor="start">Protection according to the selected native parameters</text>

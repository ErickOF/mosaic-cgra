<text x="48" y="1292" font-size="16" fill="#087f82" font-weight="700" text-anchor="start">WHAT A CONFIGURATION CHANGES</text>
<rect x="48" y="1314" width="550" height="113" rx="16" fill="#f4f7fa" stroke="#f4f7fa" stroke-width="1.5"/>
<text x="68" y="1353" font-size="21" fill="#52657c" font-weight="700" text-anchor="start">Widths + lane count</text>
<text x="68" y="1384" font-size="18" fill="#52657c" font-weight="400" text-anchor="start">Change number range, payload size and replicated logic.</text>
<text x="68" y="1409" font-size="18" fill="#52657c" font-weight="400" text-anchor="start">The widest tile sets the common grid payload width.</text>
<rect x="625" y="1314" width="550" height="113" rx="16" fill="#f4f7fa" stroke="#f4f7fa" stroke-width="1.5"/>
<text x="645" y="1353" font-size="21" fill="#52657c" font-weight="700" text-anchor="start">Tables, queues + latency</text>
<text x="645" y="1384" font-size="18" fill="#52657c" font-weight="400" text-anchor="start">Change capacity, storage and backpressure behavior.</text>
<text x="645" y="1409" font-size="18" fill="#52657c" font-weight="400" text-anchor="start">A response delay does not necessarily retime arithmetic.</text>
<rect x="1202" y="1314" width="550" height="113" rx="16" fill="#f4f7fa" stroke="#f4f7fa" stroke-width="1.5"/>
<text x="1222" y="1353" font-size="21" fill="#52657c" font-weight="700" text-anchor="start">Hardware versus runtime contexts</text>
<text x="1222" y="1384" font-size="18" fill="#52657c" font-weight="400" text-anchor="start">Generation determines which hardware exists.</text>
<text x="1222" y="1409" font-size="18" fill="#52657c" font-weight="400" text-anchor="start">Contexts program operations within that hardware.</text>
<text x="48" y="1460" font-size="18" fill="#52657c" font-weight="400" text-anchor="start">Native per-tile controls connect to a host adapter; mesh edge streams connect external producers and consumers.</text>
<text x="48" y="1487" font-size="18" fill="#52657c" font-weight="400" text-anchor="start">Layout is logical connectivity, not a floorplan. Area, timing, power and energy require later technology-specific implementation.</text>

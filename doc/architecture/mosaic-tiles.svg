<text x="1118" y="734" font-size="21" fill="#7340b4" font-weight="700" text-anchor="start">Tile-specific body</text>
<text x="1072" y="765" font-size="18" fill="#52657c" font-weight="400" text-anchor="start">Selected FUs + registers, accumulators and local state</text>
<text x="1072" y="790" font-size="18" fill="#52657c" font-weight="400" text-anchor="start">Unavailable operation classes are rejected</text>
<text x="1052" y="855" font-size="18" fill="#52657c" font-weight="400" text-anchor="start">Data streams connect through the separate local switch.</text>
<text x="1052" y="883" font-size="17" fill="#52657c" font-weight="400" text-anchor="start">A shell power protocol does not imply enabled physical power gating.</text>

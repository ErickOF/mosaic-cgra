<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500" role="img" aria-labelledby="title desc">
<title id="title">MOSAIC configurable fabric and native tiles</title>
<desc id="desc">A configurable rectangular fabric contains BCT, MST, VCT, SFT and CPT tiles, one local switch per tile and shared banked SRAM. Every native tile composes a common shell with a specialized body. Independent FU enables and widths are design-time hardware choices; runtime contexts program the hardware that exists. Every tile belongs to one continuous mesh.</desc>
